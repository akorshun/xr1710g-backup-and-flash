name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Firmware checksums
        run: cd firmware && sha256sum -c SHA256SUMS

      - name: Backup initramfs is reproducible
        run: |
          python3 tools/make-backup-initramfs.py \
            firmware/openwrt-airoha-an7581-gemtek_xr1710g-ubi-initramfs-recovery.itb /tmp/backup.itb
          cmp /tmp/backup.itb firmware/xr1710g-backup-initramfs.itb
          python3 tools/make-backup-initramfs.py --check firmware/xr1710g-backup-initramfs.itb

      - name: shellcheck
        run: shellcheck -s sh router/install-ubi.sh tests/test-install-ubi.sh

      - name: install-ubi.sh under dash and busybox ash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox
          SH=dash tests/test-install-ubi.sh
          SH="busybox sh" tests/test-install-ubi.sh

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse the PowerShell script
        shell: powershell
        run: |
          $e = $null
          [Management.Automation.Language.Parser]::ParseFile("$PWD\xr1710g-flash.ps1", [ref]$null, [ref]$e) | Out-Null
          if ($e) { $e | ForEach-Object { "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }

      - name: End-to-end run against the fake router
        shell: powershell
        run: .\tests\run-fake.ps1 -Work "$env:RUNNER_TEMP\xr1710g-fake"
